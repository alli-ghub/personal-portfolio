<!DOCTYPE html> 
<html lang="en"> <head> 
<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Live Message Preview</title> 
<style> body { 
font-family: Arial, sans-serif; margin: 0; 
padding: 30px; 
background: #f2f4f7; 
color: #222; 
}
.page { max-width: 700px; 
margin: auto; 
background: white; 
padding: 25px; border-radius: 10px; 
}
textarea { width: 100%; 
height: 120px; box-sizing: border-box; 
padding: 10px; 
}
button { 
padding: 10px 15px; 
border: 0; 
border-radius: 5px; 
cursor: pointer; 
}
#counter { text-align: right; 
margin-top: 5px; 
font-size: 14px; 
}
#preview { min-height: 80px;
padding: 12px; 
border: 1px solid #ccc; 
margin-top: 10px; 
white-space: pre-wrap; 
}
.dark { 
background: #202124; color: white; 
}
.dark .page { background: #303134; 
}
.dark #preview { 
border-color: #777; 
}
</style> 
</head> 
<body> <div class="page"> <h1>Live Message Preview</h1> 
<label for="messageBox">Message</label> 
<textarea id="messageBox" maxlength="280" 
placeholder="Type your message here..."></textarea> 
<div id="counter">0 / 280</div> 
<h2>Message Preview</h2> 
<div id="preview">Your message will appear here.</div> 
<br>
<button id="themeBtn">Switch Theme</button>
</div> 
<script> 
const messageBox = document.getElementById("messageBox"); 
const counter = document.getElementById("counter"); 
const preview = document.getElementById("preview"); 
const themeBtn = document.getElementById("themeBtn"); 
messageBox.addEventListener("input", function() { 
counter.textContent = messageBox.value.length + " / 280"; 
preview.textContent = messageBox.value; 
});
themeBtn.addEventListener("click", function() { 
document.body.classList.toggle("dark"); 
});
</script> 
</body> 
</html>
